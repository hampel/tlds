name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix. Everything between
      # fails only when a corner does.
      #
      # One job per supported Laravel major, because a declared version that is never
      # resolved is an unbacked promise. The floor takes --prefer-lowest, which is the
      # only thing that ever resolves the dev toolchain low.
      #
      # Laravel 13 gets both ends of the PHP range: it runs on 8.3 through 8.5, so it
      # spans the range this package supports.
      #
      # The 8.5 job is NOT confirmation of what PHPStan already found, whatever the
      # phpVersion range in phpstan.neon suggests. Measured: that range reports only
      # what holds at EVERY version in it, so a deprecation arriving at 8.4 or 8.5 is
      # invisible to it while the floor is still 8.3. This job is the only thing that
      # sees one. Do not drop it.
      matrix:
        include:
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0', deps: '--prefer-lowest' }
          - { php: '8.3', laravel: '^13.0', testbench: '^11.0', deps: '' }
          - { php: '8.5', laravel: '^13.0', testbench: '^11.0', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # --with, not `composer require`: it constrains within the declared range and
      # refuses to go outside it, so the matrix cannot drift away from composer.json
      # without the job failing. Every illuminate/* component this package requires is
      # named - constraining only one would leave the others free to resolve a
      # different major than the job claims to be testing.
      #
      # Testbench is pinned alongside because its majors track Laravel's - Testbench 10
      # is Laravel 12, Testbench 11 is Laravel 13 - and it is what drags the framework
      # in, so left free it would pull a different Laravel than the one just named.
      - run: >
          composer update
          --with="illuminate/console:${{ matrix.laravel }}"
          --with="illuminate/contracts:${{ matrix.laravel }}"
          --with="illuminate/http:${{ matrix.laravel }}"
          --with="illuminate/support:${{ matrix.laravel }}"
          --with="orchestra/testbench:${{ matrix.testbench }}"
          --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including larastan's view of whichever
      # Laravel was installed, which is the whole reason this job varies it.
      #
      # Pint is deliberately absent from the --prefer-lowest job's toolchain concerns:
      # its rule set moves between patches, so the oldest Pint rejects what the newest
      # accepts. Linting happens once, in the lint job.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          # Both are dev dependencies the install below deletes, and both have to run
          # from outside the package. setup-php puts them outside every vendor tree by
          # construction, which for PHPStan is load-bearing rather than convenient: run
          # in place it picks up the autoloader beside it and lends this package the
          # borrowed package's dependencies, passing the very class it was written to
          # catch.
          tools: phpstan, composer-require-checker

      - run: composer install --no-dev --prefer-dist --no-progress

      # Analyse src/ with the dev dependencies gone, so anything it calls that is not in
      # "require" comes back as not-found. -c is not optional: without it PHPStan
      # discovers the package's own phpstan.neon, which points at tests/ and includes
      # larastan, turning the run into a configuration error while you are trying to
      # read it as a dependency result.
      #
      # Know what this does NOT cover here. --no-dev removes require-dev and nothing
      # else, and laravel/framework "replace"s every illuminate/* component - so the
      # framework is still what satisfies this package's illuminate requirements and
      # every Illuminate symbol resolves whether declared or not. What it does catch is
      # a src/ reference to something only a dev dependency supplies: a Testbench class,
      # a PHPUnit assertion.
      - run: >
          phpstan analyse -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

      # The analysis above cannot see a dependency that arrives transitively, and this
      # package had one that mattered: league/flysystem was caught in a src/ catch block
      # while illuminate/filesystem only SUGGESTS it, so a consumer got a class that did
      # not exist. composer-require-checker maps each symbol back to the package that
      # supplies it and fails on anything outside "require". It is also the only check
      # that catches an undeclared ext-*, since PHPStan knows those functions from its
      # own stubs and the suite passes because the runner has the extension.
      #
      # The whitelist is not a way to silence findings. Every entry is an Illuminate
      # symbol whose component IS in "require" and which can never resolve anyway,
      # because framework replaces the component and there is no vendor/illuminate/ to
      # attribute it to. A NEW Illuminate symbol appearing here is a prompt to check its
      # component is in "require", not to extend the list on sight - and a non-Illuminate
      # symbol appearing here is a real finding.
      - run: >
          composer-require-checker check
          --config-file=.github/composer-require-checker.json
          composer.json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
